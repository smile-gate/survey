<!-- =====================================================
     겸업 형태 카드 — 아래 내용으로 통째로 교체
     ===================================================== -->
<div class="card">
  <p class="section-title">겸업 형태</p>
  <div class="radio-group">
    <label><input type="radio" name="겸업형태" value="사업체운영_사업자등록"> 사업체 운영 (사업자등록)</label>
    <div class="sub-field" id="sub_bizowner" style="display:none">
      <div class="sub-label">사업자등록 명의</div>
      <div class="radio-group" style="flex-direction:row;gap:16px">
        <label><input type="radio" name="사업자등록명의" value="본인"> 본인</label>
        <label><input type="radio" name="사업자등록명의" value="가족"> 가족</label>
        <label><input type="radio" name="사업자등록명의" value="타인"> 타인</label>
      </div>
    </div>

    <label><input type="radio" name="겸업형태" value="타사소속_직책직무수행"> 타사 소속 (타업체에서 직책·직무 수행)</label>
    <div class="sub-field" id="sub_insurance" style="display:none">
      <div class="sub-label">타사 4대보험 가입 여부</div>
      <div class="radio-group" style="flex-direction:row;gap:16px">
        <label><input type="radio" name="4대보험가입" value="가입"> 가입</label>
        <label><input type="radio" name="4대보험가입" value="미가입"> 미가입</label>
      </div>
    </div>

    <label><input type="radio" name="겸업형태" value="기타활동_부업_개별활동"> 기타 활동 (그 외 부업이나 개별활동)</label>
    <div class="sub-field" id="sub_insurance2" style="display:none">
      <div class="sub-label">타사 4대보험 가입 여부</div>
      <div class="radio-group" style="flex-direction:row;gap:16px">
        <label><input type="radio" name="4대보험가입_부업" value="가입"> 가입</label>
        <label><input type="radio" name="4대보험가입_부업" value="미가입"> 미가입</label>
      </div>
    </div>
  </div>
</div>

<!-- =====================================================
     업무 종류 카드 — 아래 내용으로 통째로 교체
     ===================================================== -->
<div class="card">
  <p class="section-title">업무 종류 (복수 선택 가능)</p>
  <div class="check-group">
    <label><input type="checkbox" name="업무종류" value="사업체_직접관리_운영"> 사업체 직접 관리 및 운영 (회사·업장·온라인몰 등 직접 운영 또는 타인/직원 위탁 운영)</label>
    <label><input type="checkbox" name="업무종류" value="타사출근_업무수행"> 타사 출근 및 업무 수행 (타사로 출근하여 사무·개발·아트 등의 업무 수행)</label>
    <label><input type="checkbox" name="업무종류" value="정치활동_참여"> 정치활동 참여 (예: 공직선거 출마, 정당 대변인·당직자 임명, 선거캠프 활동 등)</label>
    <label><input type="checkbox" name="업무종류" value="일반_아르바이트"> 일반 아르바이트 (배달, 대리운전, 사무보조, 시험감독 등)</label>
    <label><input type="checkbox" name="업무종류" value="상시정기_외부출강"> 상시·정기적 외부기관 출강 (대학, 학원 등 정기 강의)</label>
    <label><input type="checkbox" name="업무종류" value="일회성_외부출강"> 일회성·일시적 외부기관 출강 (이벤트성 특강, 세미나 등)</label>
    <label><input type="checkbox" name="업무종류" value="미디어_창작_대외활동"> 미디어 창작 및 대외활동 (유튜브, 개인방송, 블로그 운영, 도서 출판, 작곡 등)</label>
    <label><input type="checkbox" name="업무종류" value="기타_개인활동"> 기타 개인 활동 (외부 봉사활동, 공연, 취미/특기, 과외, 멘토링 등)</label>
    <label><input type="checkbox" name="업무종류" value="CCL_게임개발_판매"> CCL을 통한 게임 개발 및 판매 활동</label>
    <label><input type="checkbox" name="업무종류" value="CCL_게임개발_부속활동"> CCL 게임 개발 관련 부속 활동 (유튜브 개설운영, 대외 행사 참가 등)</label>
    <label><input type="checkbox" name="업무종류" value="기타_직접입력" id="chk_etc"> 기타 (개별입력)</label>
    <div id="etc_input_box" style="display:none;margin-left:22px;margin-top:4px">
      <input type="text" name="업무종류_기타내용" placeholder="기타 업무 내용을 입력해 주세요." style="font-size:14px;color:#1a1a1a;background:#fff;border:1px solid #ddd;border-radius:8px;padding:9px 11px;width:100%;outline:none;font-family:inherit">
    </div>
  </div>
</div>

<script>
/* 겸업 형태 조건부 표시 — 기존 스크립트 블록의 해당 부분을 아래로 교체 */
document.querySelectorAll('input[name="겸업형태"]').forEach(r => {
  r.addEventListener('change', () => {
    document.getElementById('sub_bizowner').style.display  = 'none';
    document.getElementById('sub_insurance').style.display = 'none';
    document.getElementById('sub_insurance2').style.display = 'none';
    if (r.value === '사업체운영_사업자등록')      document.getElementById('sub_bizowner').style.display  = 'block';
    else if (r.value === '타사소속_직책직무수행')  document.getElementById('sub_insurance').style.display = 'block';
    else if (r.value === '기타활동_부업_개별활동') document.getElementById('sub_insurance2').style.display = 'block';
  });
});

/* 기타 텍스트 입력칸 토글 */
document.getElementById('chk_etc').addEventListener('change', function() {
  document.getElementById('etc_input_box').style.display = this.checked ? 'block' : 'none';
});
</script>
